[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-scan-binarize"
version = "0.1.0"
description = "High-quality binarization for scanned manga pages preserving screentones, optimized for vectorization (potrace / Illustrator)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Yos Awed" }
]
keywords = [
    "manga",
    "scan",
    "binarization",
    "halftone",
    "screentone",
    "potrace",
    "vectorization",
    "image-processing",
    "opencv"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
]

[project.scripts]
manga-binarize = "manga_binarize:main"

[project.urls]
Homepage = "https://github.com/YosAwed/manga-scan-binarize"
Repository = "https://github.com/YosAwed/manga-scan-binarize"
